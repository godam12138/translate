<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>课堂同传 · 英译中实时字幕</title>
<style>
  :root { --fs: 1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f7; color: #171717;
    padding: 16px 16px 48px; max-width: 760px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 600; }
  #status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #52525b; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
  .dot.on { background: #10b981; }

  .warn {
    background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
    border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.6; margin-bottom: 12px;
  }

  details {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  summary { font-size: 14px; font-weight: 600; cursor: pointer; }
  details details { border: none; padding: 8px 0 0; margin: 0; background: transparent; }
  details details summary { font-weight: 400; font-size: 13px; color: #6b7280; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .row label { width: 72px; font-size: 13px; color: #52525b; flex-shrink: 0; }
  .row select, .row input {
    flex: 1; min-width: 0; font-size: 14px; padding: 8px 10px;
    border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: #171717;
  }
  .row button {
    font-size: 14px; padding: 8px 14px; border: 1px solid #d1d5db;
    border-radius: 8px; background: #fff; cursor: pointer;
  }
  #llmBox { border-top: 1px dashed #e5e7eb; margin-top: 10px; padding-top: 4px; }
  .hint { font-size: 12px; color: #6b7280; line-height: 1.6; margin-top: 8px; }

  #bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #mainBtn {
    flex: 1; font-size: 18px; font-weight: 600; padding: 14px 0;
    border: none; border-radius: 12px; background: #10b981; color: #fff; cursor: pointer;
  }
  #mainBtn:disabled { background: #9ca3af; }
  #mainBtn.stop { background: #ef4444; }
  #counter { font-size: 12px; color: #6b7280; white-space: nowrap; }
  #bar .miniBtn {
    font-size: 13px; padding: 10px 12px; border: 1px solid #d1d5db;
    border-radius: 10px; background: #fff; color: #171717; cursor: pointer;
  }

  #current {
    background: #fff; border: 1px dashed #d1d5db; border-radius: 12px;
    font-size: calc(18px * var(--fs)); color: #6b7280; font-style: italic;
    padding: 12px 14px; line-height: 1.5; margin-bottom: 10px;
  }
  #list { list-style: none; }
  #list li {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; line-height: 1.55;
  }
  #list .en { font-size: calc(20px * var(--fs)); color: #111827; margin-bottom: 4px; }
  #list .zh { font-size: calc(18px * var(--fs)); color: #2563eb; }
  #list .zh.warn { color: #b45309; font-size: calc(14px * var(--fs)); }

  #pauseBtn { background: #fff7ed; border-color: #fdba74; color: #9a3412; }
  #summaryBox {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  #summaryBox h3 { font-size: 14px; font-weight: 600; color: #2563eb; margin-bottom: 8px; }
  #summaryText { font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: #111827; }

  .tips { font-size: 12px; color: #6b7280; line-height: 1.7; margin-top: 16px; }

  @media (prefers-color-scheme: dark) {
    body { background: #101012; color: #e5e7eb; }
    details, #list li, .row select, .row input, .row button, #current, #bar .miniBtn, #summaryBox { background: #1a1a1e; border-color: #2d2d33; color: #e5e7eb; }
    #list .en { color: #f3f4f6; }
    #pauseBtn { background: #2a2114; border-color: #6b4a20; color: #fbbf24; }
    #summaryText { color: #e5e7eb; }
    .warn { background: #2a1414; border-color: #5b2020; color: #fca5a5; }
  }
</style>
</head>
<body>
<header>
  <h1>课堂同传</h1>
  <div id="status"><span class="dot"></span><span id="statusText">未开始</span></div>
</header>

<div id="supportWarn" class="warn" hidden>
  当前浏览器不支持语音识别。<br />
  iPad 请用 <b>Safari</b> 打开本页；安卓平板请用 <b>Edge</b> 试试；电脑请用 Edge 或 Chrome。
</div>

<details id="settingsBox">
  <summary>设置</summary>
  <div class="row">
    <label>翻译引擎</label>
    <select id="engine">
      <option value="llm">大模型接口（推荐，需 Key）</option>
      <option value="mymemory">MyMemory（免注册，额度小）</option>
    </select>
  </div>
  <div id="llmBox" hidden>
    <div class="row"><label>API Key</label><input id="llmKey" type="password" placeholder="粘贴 sk- 开头的 Key，填一次自动记住" /></div>
    <div class="row">
      <label></label>
      <button id="testBtn">测试连接</button>
      <span id="testOut" style="font-size:12px;color:#6b7280;flex:1;word-break:break-all;line-height:1.5"></span>
    </div>
    <p class="hint">硅基流动的 Qwen3-8B 长期免费、国内直连。Key 只保存在这台设备，下次打开自动填好。</p>
  </div>
  <div class="row" id="mmBox" hidden>
    <label>邮箱(可选)</label>
    <input id="mmEmail" placeholder="填后免费额度 5千 → 5万字符/天" />
  </div>
  <details id="advBox">
    <summary>高级设置（一般不用动）</summary>
    <div class="row"><label>接口地址</label><input id="llmUrl" value="https://api.siliconflow.cn/v1" /></div>
    <div class="row"><label>模型名</label><input id="llmModel" value="Qwen/Qwen3-8B" /></div>
  </details>
  <div class="row">
    <label>中文朗读</label>
    <select id="ttsSel">
      <option value="off">关（推荐，不打断收音）</option>
      <option value="on">开</option>
    </select>
  </div>
  <div class="row">
    <label>字幕字号</label>
    <button id="fontDown">A−</button>
    <button id="fontUp">A＋</button>
  </div>
</details>

<div id="bar">
  <button id="mainBtn">开始翻译</button>
  <button id="pauseBtn" class="miniBtn" hidden>暂停</button>
  <span id="counter"></span>
  <button id="exportBtn" class="miniBtn">保存文件</button>
  <button id="clearBtn" class="miniBtn">清空</button>
</div>

<div id="summaryBox" hidden>
  <h3>要点总结</h3>
  <div id="summaryText"></div>
</div>

<ul id="list"></ul>
<div id="current" hidden></div>

<p class="tips">
  小贴士：坐在离老师近的位置收音更准；使用中不要锁屏、不要切走页面（iPad 可用分屏）；老师说中文时识别会变乱属正常现象；
  默认的 MyMemory 有每日字符限额，适合"跟不上时看一眼"；要整节课全覆盖，就在设置里切换成大模型接口（硅基流动的 Qwen3-8B 长期免费）。
</p>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, running = false, paused = false, chars = 0, fs = 1, lock = null;
var summaryText = "";

if (!SR) { $("supportWarn").hidden = false; $("mainBtn").disabled = true; }

/* ---------- 设置读写 ---------- */
function saveSettings() {
  try {
    localStorage.setItem("tongchuan", JSON.stringify({
      engine: $("engine").value, url: $("llmUrl").value,
      key: $("llmKey").value, model: $("llmModel").value, tts: $("ttsSel").value,
      mm: $("mmEmail").value
    }));
  } catch (e) {}
}
function loadSettings() {
  var s = {};
  try { s = JSON.parse(localStorage.getItem("tongchuan") || "{}"); } catch (e) {}
  try {
    if (s.engine) $("engine").value = s.engine;
    if (s.url) $("llmUrl").value = /bigmodel\.cn/.test(s.url) ? "https://api.siliconflow.cn/v1" : s.url;
    if (s.key) $("llmKey").value = s.key;
    if (s.model && s.model !== "glm-4-flash") $("llmModel").value = s.model;
    if (s.tts) $("ttsSel").value = s.tts;
    if (s.mm) $("mmEmail").value = s.mm;
  } catch (e) {}
  $("settingsBox").open = !s.key;   // 已经填过 Key 就默认收起设置，界面更干净
  updateEngineUI();
}
function updateEngineUI() {
  var e = $("engine").value;
  $("llmBox").hidden = e !== "llm";
  $("mmBox").hidden = e !== "mymemory";
}
loadSettings();
/* 边输入边保存：即便没点别处就关掉页面，配置也不会丢 */
["mmEmail", "llmUrl", "llmKey", "llmModel", "ttsSel"].forEach(function (id) {
  $(id).oninput = saveSettings;
  $(id).onchange = saveSettings;
});
$("engine").onchange = function () { updateEngineUI(); saveSettings(); };

/* ---------- 测试连接：把真实错误露出来，方便排查 ---------- */
$("testBtn").onclick = function () {
  var out = $("testOut");
  var key = $("llmKey").value.trim();
  var base = $("llmUrl").value.trim().replace(/\/+$/, "");
  var model = $("llmModel").value.trim();
  if (!key) { out.textContent = "还没填 API Key"; return; }
  if (/\s/.test(key)) { out.textContent = "Key 里含空格或换行，请重新复制"; return; }
  out.textContent = "测试中…（" + model + "）";
  fetch(base + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify({ model: model, messages: [{ role: "user", content: "Reply with the single word: OK" }] })
  }).then(function (r) {
    return r.text().then(function (t) {
      if (r.ok) out.textContent = "连接正常，模型回复：" + t.slice(0, 80);
      else out.textContent = "接口返回 HTTP " + r.status + "：" + t.slice(0, 160);
    });
  }).catch(function (e) {
    out.textContent = "请求没发出去（" + e.name + "）地址=" + base + " 详情=" + e.message;
  });
};

$("fontUp").onclick = function () { fs = Math.min(1.8, fs + 0.15); document.documentElement.style.setProperty("--fs", fs); };
$("fontDown").onclick = function () { fs = Math.max(0.7, fs - 0.15); document.documentElement.style.setProperty("--fs", fs); };

/* ---------- 状态 ---------- */
function setStatus(text, on) {
  $("statusText").textContent = text;
  document.querySelector(".dot").classList.toggle("on", !!on);
}

/* ---------- 中文朗读 ---------- */
function speak(zh) {
  if ($("ttsSel").value !== "on" || !("speechSynthesis" in window)) return;
  var u = new SpeechSynthesisUtterance(zh);
  u.lang = "zh-CN"; u.rate = 1.05;
  speechSynthesis.speak(u);
}

/* ---------- 翻译 ---------- */
function translate(text, onPartial) {
  if ($("engine").value === "mymemory") {
    var url = "https://api.mymemory.translated.net/get?langpair=en|zh-CN&q=" + encodeURIComponent(text);
    var em = $("mmEmail").value.trim();
    if (em) url += "&de=" + encodeURIComponent(em);
    return fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.responseData || !d.responseData.translatedText) throw new Error("翻译接口无返回");
      var t = d.responseData.translatedText;
      if (/MYMEMORY WARNING/i.test(t)) throw new Error("今日免费额度用完，请在设置里换成大模型接口");
      var el = document.createElement("div"); el.innerHTML = t;
      return el.textContent;
    });
  }
  var key = $("llmKey").value.trim();
  if (!key) return Promise.reject(new Error("请先在设置里填入 API Key"));
  var base = $("llmUrl").value.trim().replace(/\/+$/, "");
  var model = $("llmModel").value.trim() || "Qwen/Qwen3-8B";
  var body = {
    model: model,
    temperature: 0.2,
    messages: [
      { role: "system", content: "你是课堂同声传译，把英文课堂内容翻译成简体中文。只输出译文，不要解释、不要任何前缀。专业术语第一次出现时在括号里保留英文原文。" },
      { role: "user", content: text }
    ]
  };
  // Qwen3 默认会先"思考"再回答，翻译场景关掉它，快很多
  if (/qwen3/i.test(model)) body.enable_thinking = false;
  body.stream = true;        // 流式返回：中文边生成边显示，不用等整句
  body.max_tokens = 220;
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 30000);   // 30 秒没响应就放弃，避免整队列卡死
  return fetch(base + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify(body),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) {
    clearTimeout(timer);
    if (!r.ok) throw new Error(httpMsg(r.status));
    // 个别接口不支持流式时，退回一次性读取
    if (!r.body || !r.body.getReader) {
      return r.json().then(function (d) {
        var out = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
        if (!out) throw new Error("接口无译文");
        return out.trim();
      });
    }
    var reader = r.body.getReader(), dec = new TextDecoder(), acc = "", buf = "";
    function pump() {
      return reader.read().then(function (res) {
        if (res.done) {
          var t = acc.trim();
          if (!t) throw new Error("接口无译文");
          return t;
        }
        buf += dec.decode(res.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf("data:") !== 0) continue;
          var d = line.slice(5).trim();
          if (d === "[DONE]") continue;
          try {
            var j = JSON.parse(d);
            var delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (delta) { acc += delta; if (onPartial) onPartial(acc); }
          } catch (e) {}
        }
        return pump();
      });
    }
    return pump();
  }, function (err) {
    clearTimeout(timer);
    if (err && err.name === "AbortError") throw new Error("请求超时，网络太慢");
    throw new Error("连不上接口，检查网络或接口地址");
  });
}
function httpMsg(code) {
  if (code === 401) return "Key 无效，请检查是否完整复制";
  if (code === 402) return "余额不足，需要充值";
  if (code === 403) return "无权限，可能未实名认证";
  if (code === 400) return "模型名不对，请检查设置";
  if (code === 429) return "请求太频繁，稍等";
  return "接口返回 " + code;
}
/* 并发池：最多同时翻 2 句，既不堆积又不会串行等太久 */
var MAX_CONC = 2, active = 0, waiting = [];
function translateQueued(text, onPartial) {
  return new Promise(function (resolve, reject) {
    var job = { text: text, onPartial: onPartial, resolve: resolve, reject: reject };
    if (active >= MAX_CONC) {
      if (waiting.length >= 6) { reject(new Error("排队太多，这行先跳过")); return; }
      waiting.push(job);
      return;
    }
    runJob(job);
  });
}
function runJob(job) {
  active++;
  translateRetry(job.text, job.onPartial).then(function (v) {
    active--; job.resolve(v); nextJob();
  }, function (e) {
    active--; job.reject(e); nextJob();
  });
}
function nextJob() {
  while (active < MAX_CONC && waiting.length) runJob(waiting.shift());
}
/* 限流或网络抖动时，等 1.8 秒重试一次 */
function translateRetry(text, onPartial) {
  return translate(text, onPartial).catch(function (e) {
    if (!/频繁|超时|连不上/.test(e.message)) throw e;
    return new Promise(function (res) { setTimeout(res, 1800); }).then(function () { return translate(text, onPartial); });
  });
}

/* ---------- 字幕条目 ---------- */
function nearBottom() {
  return (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 160);
}
function scrollBottom() { if (nearBottom()) window.scrollTo(0, document.body.scrollHeight); }

/* 把零碎的识别片段拼成完整句子再翻译：上下文越长，翻译越准 */
var pending = "", pendingTimer = null;
function flushPending() {
  if (!pending) return;
  var s = pending; pending = "";
  clearTimeout(pendingTimer); pendingTimer = null;
  addFinal(s);
}
function pushFinal(t) {
  pending = pending ? pending + " " + t : t;
  // 够长、或句尾标点出现、或停顿 0.8 秒，就送去翻译（延迟小，更接近"边听边译"）
  if (pending.length >= 40 || /[.!?]["'”)]?\s*$/.test(t)) { flushPending(); }
  else {
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(flushPending, 800);
  }
}

/* ---------- 记录保存与导出 ---------- */
var logKey = "tongchuan_log", records = [];
try { records = JSON.parse(localStorage.getItem(logKey) || "[]"); } catch (e) { records = []; }
function saveLog() { try { localStorage.setItem(logKey, JSON.stringify(records.slice(-500))); } catch (e) {} }
function renderLi(rec) {
  var li = document.createElement("li");
  var enEl = document.createElement("div"); enEl.className = "en"; enEl.textContent = rec.en;
  var zhEl = document.createElement("div"); zhEl.className = "zh"; zhEl.textContent = rec.zh || "翻译中…";
  li.appendChild(enEl); li.appendChild(zhEl);
  return { li: li, zhEl: zhEl };
}
function appendLi(v) {
  var list = $("list");
  list.appendChild(v.li);
  while (list.children.length > 40) list.removeChild(list.firstChild);
}
/* 恢复上次保存的记录（最近 40 条） */
records.slice(-40).forEach(function (r) { appendLi(renderLi(r)); });

/* 保存成一个文件：要点总结 + 完整中英记录 */
$("exportBtn").onclick = function () {
  if (!records.length) { alert("还没有记录可保存"); return; }
  var now = new Date();
  var pad = function (n) { return ("0" + n).slice(-2); };
  var head = "# 课堂记录 " + now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) +
             " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + "\n\n";
  if (summaryText) head += "## 要点总结\n\n" + summaryText + "\n\n";
  head += "## 完整记录（共 " + records.length + " 条）\n\n";
  var lines = records.map(function (r) {
    var d = new Date(r.ts);
    var t = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    return "**[" + t + "]** " + r.en + "\n\n> " + (r.zh || "（未翻译）") + "\n";
  });
  var md = head + lines.join("\n");
  var blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "课堂记录_" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "_" + pad(now.getHours()) + pad(now.getMinutes()) + ".md";
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
};
$("clearBtn").onclick = function () {
  if (!confirm("确定清空所有保存的记录？")) return;
  records = []; saveLog(); $("list").innerHTML = "";
};

function addFinal(en) {
  var rec = { ts: Date.now(), en: en, zh: "" };
  records.push(rec); saveLog();
  var v = renderLi(rec);
  appendLi(v);
  scrollBottom();
  translateQueued(en, function (partial) {
    v.zhEl.className = "zh";
    v.zhEl.textContent = partial;
    scrollBottom();
  }).then(function (t) { v.zhEl.textContent = t; rec.zh = t; saveLog(); speak(t); })
    .catch(function (e) { v.zhEl.textContent = "⚠ " + e.message; v.zhEl.className = "zh warn"; saveLog(); })
    .then(scrollBottom);
  chars += en.length;
  $("counter").textContent = "已翻译 " + chars + " 字符";
}

/* ---------- AI 要点总结 ---------- */
function callLLM(userContent, maxTokens) {
  var key = $("llmKey").value.trim();
  var base = $("llmUrl").value.trim().replace(/\/+$/, "");
  var model = $("llmModel").value.trim() || "Qwen/Qwen3-8B";
  if (!key) return Promise.reject(new Error("没填 API Key"));
  var body = { model: model, temperature: 0.3, max_tokens: maxTokens || 400, messages: [{ role: "user", content: userContent }] };
  if (/qwen3/i.test(model)) body.enable_thinking = false;
  return fetch(base + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.text().then(function (t) {
      if (!r.ok) throw new Error(httpMsg(r.status));
      var d = JSON.parse(t);
      var out = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      if (!out) throw new Error("接口无内容");
      return out.trim();
    });
  });
}

/* 结束后自动总结：记录太长就分段总结再合并 */
function summarize() {
  var box = $("summaryBox"), out = $("summaryText");
  if (!records.length) return;
  box.hidden = false;
  if ($("engine").value === "mymemory" || !$("llmKey").value.trim()) {
    out.textContent = "AI 总结需要先在设置里选「大模型接口」并填入 API Key。中文记录本身已经保存，可以直接点「保存文件」。";
    return;
  }
  out.textContent = "正在整理要点…";
  try { box.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {}

  var lines = records.map(function (r) { return "- " + r.en + " / " + (r.zh || ""); });
  var chunks = [], cur = "";
  lines.forEach(function (l) {
    if (cur.length + l.length > 4000) { chunks.push(cur); cur = ""; }
    cur += l + "\n";
  });
  if (cur) chunks.push(cur);

  var parts = [], p = Promise.resolve();
  chunks.forEach(function (c, i) {
    p = p.then(function () {
      out.textContent = "正在整理要点…（" + (i + 1) + "/" + chunks.length + "）";
      return callLLM("你是课堂笔记助手。下面是英文课堂的逐句记录（英文/中文对照）。请提炼中文要点，最多 6 条，每条一行以\"- \"开头，只输出要点。\n\n" + c, 300);
    }).then(function (t) { parts.push(t); });
  });

  return p.then(function () {
    if (chunks.length === 1) return parts[0];
    out.textContent = "正在汇总要点…";
    return callLLM("下面是同一堂课分段提炼的要点，请合并去重，整理成最多 10 条中文要点，每条一行以\"- \"开头，只输出要点。\n\n" + parts.join("\n"), 400);
  }).then(function (t) {
    summaryText = t;
    out.textContent = t;
  }).catch(function (e) {
    out.textContent = "总结失败：" + e.message + "（记录仍然可以保存）";
  });
}

/* ---------- 语音识别（自动重启） ---------- */
function startRec() {
  rec = new SR();
  rec.lang = "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = function (e) {
    var interim = "", finalTxt = "";
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var r = e.results[i];
      if (r.isFinal) finalTxt += r[0].transcript; else interim += r[0].transcript;
    }
    if (interim) {
      var c = $("current"); c.hidden = false; c.textContent = pending ? pending + " " + interim : interim;
      scrollBottom();
    }
    if (finalTxt) {
      finalTxt = finalTxt.trim();
      if (finalTxt) pushFinal(finalTxt);
      $("current").hidden = !pending;
      if (pending) $("current").textContent = pending;
    }
  };
  rec.onerror = function (e) {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      stopAll(); setStatus("麦克风权限被拒绝，请在浏览器设置里允许", false);
    } else if (e.error === "network") {
      setStatus("识别服务网络异常，自动重试中…", false);
    }
  };
  rec.onend = function () {
    // 识别自动停了就重启，实现"连续同传"；暂停时不重启
    if (running && !paused) { flushPending(); setTimeout(function () { if (running && !paused) startRec(); }, 300); }
  };
  try { rec.start(); } catch (e) {}
}
function stopAll() {
  running = false;
  paused = false;
  flushPending();
  if (rec) { try { rec.stop(); } catch (e) {} }
  $("current").hidden = true;
  var b = $("mainBtn");
  b.textContent = "开始翻译"; b.classList.remove("stop");
  var p = $("pauseBtn");
  p.hidden = true; p.textContent = "暂停";
  setStatus("已结束", false);
}

/* ---------- 主按钮 + 暂停按钮 ---------- */
$("mainBtn").onclick = function () {
  if (!SR) return;
  if (!running) {
    running = true; paused = false;
    summaryText = "";
    $("summaryBox").hidden = true;
    $("pauseBtn").hidden = false;
    $("current").hidden = true;
    var b = $("mainBtn");
    b.textContent = "结束"; b.classList.add("stop");
    setStatus("聆听中…", true);
    keepAwake();
    startRec();
  } else {
    stopAll();
    setTimeout(summarize, 1200);   // 等最后几句翻完再总结
  }
};

$("pauseBtn").onclick = function () {
  if (!running) return;
  if (!paused) {
    paused = true;
    flushPending();
    if (rec) { try { rec.stop(); } catch (e) {} }
    $("pauseBtn").textContent = "继续";
    setStatus("已暂停（课间休息）", false);
  } else {
    paused = false;
    $("pauseBtn").textContent = "暂停";
    setStatus("聆听中…", true);
    keepAwake();
    startRec();
  }
};

/* ---------- 防休眠 ---------- */
function keepAwake() {
  if (navigator.wakeLock) {
    navigator.wakeLock.request("screen").then(function (l) { lock = l; }).catch(function () {});
  }
}
document.addEventListener("visibilitychange", function () {
  if (running && document.visibilityState === "visible") keepAwake();
});
</script>
